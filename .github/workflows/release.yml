name: Verify and publish Project Unit
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: unit-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          # Checkout event commit: v5 tag-mode can replace an annotation with GITHUB_SHA.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm test
      - name: Require matching version tag at checkout HEAD
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py identity --tag "$GITHUB_REF_NAME"
      - name: Independently stage and check candidate
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          python3 scripts/release.py stage --tag "$tag"
          python3 scripts/release.py check --tag "$tag"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-${{ github.ref_name }}
          path: dist/candidate/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          # Preserve fetched tag objects for the strict publisher identity check.
          ref: ${{ github.sha }}
      - run: python3 scripts/release.py identity --tag "$GITHUB_REF_NAME"
      - run: python3 scripts/release.py absent --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unit-${{ github.ref_name }}
          path: dist/candidate/
      - run: python3 scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Publish immutable tag release (no npm or OCI)
        run: python3 scripts/publication.py publish --tag "$GITHUB_REF_NAME"
